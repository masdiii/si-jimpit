<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Si-Jimpit | Iuran Siskamling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">

    <!-- Navbar -->
    <nav class="bg-indigo-700 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold italic tracking-tighter"><i class="fas fa-hand-holding-heart mr-2"></i>Si-Jimpit</h1>
            <span class="text-sm bg-indigo-800 px-3 py-1 rounded-full">RT 05 Siskamling Digital</span>
        </div>
    </nav>

    <div class="container mx-auto p-4 md:p-8">
        
        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-green-500">
                <p class="text-gray-500 text-sm">Total Iuran Bulan Ini</p>
                <h3 class="text-3xl font-bold text-gray-800">Rp 450.000</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-blue-500">
                <p class="text-gray-500 text-sm">Warga Sudah Bayar</p>
                <h3 class="text-3xl font-bold text-gray-800">15 / 20</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-yellow-500">
                <p class="text-gray-500 text-sm">Saldo Keamanan</p>
                <h3 class="text-3xl font-bold text-gray-800">Rp 1.200.000</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Form Input -->
            <div class="bg-white p-6 rounded-xl shadow-md h-fit">
                <h2 class="text-lg font-semibold mb-4 border-b pb-2">Catat Iuran Baru</h2>
                <form id="formIuran" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nama Warga</label>
                        <select id="namaWarga" class="w-full mt-1 p-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                            <option>Pak Budi</option>
                            <option>Pak Agus</option>
                            <option>Mas Eko</option>
                            <option>Pak RT</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Jumlah Iuran (Rp)</label>
                        <input type="number" id="jumlah" placeholder="Contoh: 10000" class="w-full mt-1 p-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tanggal</label>
                        <input type="date" id="tanggal" class="w-full mt-1 p-2 border rounded-md">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition">
                        Simpan Data
                    </button>
                </form>
            </div>

            <!-- Tabel Riwayat -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-lg font-semibold mb-4 border-b pb-2">Riwayat Iuran Terakhir</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm">
                                <th class="p-3">Tanggal</th>
                                <th class="p-3">Nama</th>
                                <th class="p-3">Jumlah</th>
                                <th class="p-3">Status</th>
                            </tr>
                        </thead>
                        <tbody id="tabelData" class="text-gray-700">
                            <tr class="border-b">
                                <td class="p-3">12 Mei 2026</td>
                                <td class="p-3 font-medium">Pak Agus</td>
                                <td class="p-3">Rp 10.000</td>
                                <td class="p-3"><span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded">Lunas</span></td>
                            </tr>
                            <tr class="border-b">
                                <td class="p-3">10 Mei 2026</td>
                                <td class="p-3 font-medium">Mas Eko</td>
                                <td class="p-3">Rp 10.000</td>
                                <td class="p-3"><span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded">Lunas</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        <!-- Tambahkan Firebase SDK melalui CDN di dalam tag <head> atau sebelum tag script utama -->
<script type="module">
  // Import fungsi-fungsi yang dibutuhkan dari Firebase SDK
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // Konfigurasi Firebase Anda (GANTI DENGAN DATA DARI KONSOL FIREBASE ANDA)
  const firebaseConfig = {
    apiKey: "AIzaSyC2kLzWHhhZsvbnW7f1ojk8VmgmZCcEGi4",
    authDomain: "si-jimpit-b9d9d.firebaseapp.com",
    projectId: "si-jimpit-b9d9d",
    storageBucket: "si-jimpit-b9d9d.firebasestorage.app",
    messagingSenderId: "912253635838",
    appId: "1:912253635838:web:c18940933c1230dd19a9af"
  };

  // Inisialisasi Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const iuranCol = collection(db, "iuran_siskamling");

  const form = document.getElementById('formIuran');
  const tabelData = document.getElementById('tabelData');

  // 1. FUNGSI SIMPAN DATA KE FIREBASE
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const nama = document.getElementById('namaWarga').value;
    const jumlah = document.getElementById('jumlah').value;
    const tanggal = document.getElementById('tanggal').value;

    if(!jumlah || !tanggal) return alert('Mohon isi semua data!');

    try {
      await addDoc(iuranCol, {
        nama: nama,
        jumlah: parseInt(jumlah),
        tanggal: tanggal,
        createdAt: new Date()
      });
      form.reset();
      alert("Data berhasil tersimpan di Cloud!");
    } catch (error) {
      console.error("Error adding document: ", error);
    }
  });

  // 2. FUNGSI BACA DATA SECARA REAL-TIME
  const q = query(iuranCol, orderBy("createdAt", "desc"));
  
  onSnapshot(q, (snapshot) => {
    tabelData.innerHTML = ""; // Bersihkan tabel sebelum update
    let totalBulanIni = 0;
    let jumlahWarga = 0;

    snapshot.forEach((doc) => {
      const data = doc.data();
      totalBulanIni += data.jumlah;
      jumlahWarga++;

      const row = `
        <tr class="border-b hover:bg-gray-50 transition">
            <td class="p-3">${data.tanggal}</td>
            <td class="p-3 font-medium">${data.nama}</td>
            <td class="p-3">Rp ${data.jumlah.toLocaleString('id-ID')}</td>
            <td class="p-3"><span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded">Lunas</span></td>
        </tr>
      `;
      tabelData.insertAdjacentHTML('beforeend', row);
    });

    // Update Dashboard secara otomatis
    document.querySelector('.text-3xl.font-bold.text-gray-800').innerText = `Rp ${totalBulanIni.toLocaleString('id-ID')}`;
  });
</script>
    </script>
</body>
</html>
